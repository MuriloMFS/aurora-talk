[package]
name = "aurora"
version = "1.3.2"
description = "Aurora — app desktop (Tauri 2). Rust aqui é só a cola nativa (ADR-001)."
authors = ["Aurora contributors"]
license = ""
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "aurora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2.14.1"
url = "2.5.8"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"

# Acesso ao WebView2 (Windows) para conceder microfone/câmera às telas do próprio app,
# e captura do som do sistema sem o próprio app (loopback por processo, WASAPI).
# Versões iguais às que o Tauri/wry já usam (ver Cargo.lock).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }

# Perfil de release voltado a tamanho (orçamento do ADR-001 §7).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
